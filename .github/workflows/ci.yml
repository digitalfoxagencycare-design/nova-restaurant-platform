name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests (includes cross-tenant isolation and architecture guards)
        working-directory: backend
        run: python -m pytest -o addopts="" -q
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Every tenant example validates against the schema
        run: |
          python - <<'PY'
          import json, glob, jsonschema
          schema = json.load(open("config/tenant.schema.json"))
          for f in glob.glob("config/tenants/*.json"):
              jsonschema.validate(json.load(open(f)), schema); print("ok", f)
          PY
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repo scanner (shapes of the credentials that leaked in the source project)
        run: python scripts/scan_secrets.py
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Known-vulnerability audit
        run: pip-audit -r backend/requirements.txt
