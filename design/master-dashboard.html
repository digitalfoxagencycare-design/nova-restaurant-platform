<script>const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
let days=30,who='owner',view='overview';
const rnd=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const SC={owner:1,c1:.42,c2:.3,c3:.2};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function S(seed,base,vol,n=days,trend=.3){const r=rnd(seed+n);return Array.from({length:n},(_,i)=>Math.max(0,Math.round(base*SC[who]*(1+trend*i/n)*(1+(r()-.5)*vol)*(1+.12*Math.sin(i*2*Math.PI/7)))))}

function spark(a,col){const m=Math.max(...a)||1,w=200,h=34;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${a.map((v,i)=>`${i*w/(a.length-1)},${h-2-(v/m)*(h-6)}`).join(' ')}" fill="none" stroke="${col||C[0]}" stroke-width="2"/></svg>`}
const kpi=(l,v,d,a,good=true)=>`<div class="kpi"><small>${l}</small><strong>${v}</strong><span class="${good?'up':'dn'}">${d}</span>${spark(a)}</div>`;
function line(sers,names,f=fmt,opts={}){const W=opts.W||700,H=240,pl=40,pb=22,n=sers[0].length;const mx=Math.max(...sers.flat().filter(v=>v!=null))*1.1||1,x=i=>pl+i*(W-pl-8)/(n-1),y=v=>H-pb-(v/mx)*(H-pb-10);let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=y(v);g+=`<line class="grid" x1="${pl}" x2="${W-8}" y1="${yy}" y2="${yy}"/><text class="axis" x="${pl-6}" y="${yy+3}" text-anchor="end">${f(v)}</text>`}
const lab=opts.labels||dl;const tk=[0,Math.floor(n/3),Math.floor(2*n/3),n-1].map(i=>`<text class="axis" x="${x(i)}" y="${H-5}" text-anchor="middle">${lab(i)}</text>`).join('');
const p=sers.map((s,k)=>{const pts=s.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(' ');const dash=(opts.dash||[])[k]?'stroke-dasharray="6 5"':'';return (k===0&&!opts.noArea?`<polygon points="${pl},${y(0)} ${pts} ${x(s.map(v=>v!=null).lastIndexOf(true))},${y(0)}" fill="${C[k]}" opacity=".12"/>`:'')+`<polyline points="${pts}" fill="none" stroke="${C[k]}" stroke-width="2.3" ${dash}/>`}).join('');
return `<div class="legend">${names.map((nm,k)=>`<span><i style="background:${C[k]}"></i>${nm}</span>`).join('')}</div><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-w="${W}" data-n="${n}" data-s='${JSON.stringify(sers)}' data-nm='${JSON.stringify(names)}' data-f="${f===inr?'inr':'n'}" data-lab="${opts.labels?'x':'d'}">${g}${tk}${p}<line class="hv" y1="8" y2="${H-pb}" stroke="#8a919a" stroke-dasharray="3" opacity="0"/></svg>`}
function bars(items,col,f=fmt,sq){const m=Math.max(...items.map(i=>i[1]))||1;return `<div class="fun">${items.map(([l,v],k)=>`<div><span>${l}</span><div class="b" style="width:${(sq?Math.sqrt(v/m):v/m)*58}%;background:${col||C[0]}"></div><b>${f(v)}</b></div>`).join('')}</div>`}
function donut(items){const t=sum(items.map(i=>i[1]))||1;let a=0;const R=60,r=38,cx=65;const sg=items.map(([l,v],k)=>{const s=a/t*2*Math.PI,e=(a+v)/t*2*Math.PI;a+=v;const p=(R_,g)=>[cx+R_*Math.sin(g),cx-R_*Math.cos(g)];const[x1,y1]=p(R,s),[x2,y2]=p(R,e),[x3,y3]=p(r,e),[x4,y4]=p(r,s),lg=e-s>Math.PI?1:0;return `<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${C[k%5]}"/>`}).join('');return `<div class="donutw"><svg viewBox="0 0 130 130">${sg}</svg><ul>${items.map(([l,v],k)=>`<li><i style="background:${C[k%5]}"></i>${l}<b>${Math.round(v/t*100)}%</b></li>`).join('')}</ul></div>`}

function bindTips(){const tip=$('#tip');$$('svg.chart').forEach(sv=>{const Sx=JSON.parse(sv.dataset.s),N=JSON.parse(sv.dataset.nm),n=+sv.dataset.n,W=+sv.dataset.w,f=sv.dataset.f==='inr'?inr:fmt,hv=sv.querySelector('.hv');sv.onmousemove=e=>{const b=sv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-40)/(W-48)*(n-1)))),px=40+i*(W-48)/(n-1);hv.setAttribute('x1',px);hv.setAttribute('x2',px);hv.setAttribute('opacity',1);tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.innerHTML='<b>'+(sv.dataset.lab==='x'?'#'+(i+1):dl(i))+'</b><br>'+Sx.map((s,k)=>N[k]+': '+(s[i]==null?'–':f(s[i]))).join('<br>')};sv.onmouseleave=()=>{tip.style.display='none';hv.setAttribute('opacity',0)}})}

const TITLES={master:'All restaurants',onb:'Onboarding',cost:'Usage & costs',apps:'Mobile apps',live:'Live orders',tables:'Tables',menu:'Menu',cust:'Customers & loyalty',deliv:'Delivery',sales:'Sales & GST',offers:'Offers'};
let LIVE=false,timer=null;
function navHTML(){const L=mode==='master'?NAVM:NAVR;return L.map(n=>`<button class="nav ${n[0]===view?'on':''}" data-v="${n[0]}">${n[1]} ${n[2]}</button>`).join('')}

function wire(){$$('.nav').forEach(n=>n.onclick=()=>{view=n.dataset.v;render();$('#side').classList.remove('on')});
$$('[data-open]').forEach(r=>r.onclick=()=>{tenant=r.dataset.open;mode='rest';view='live';resetTenantData();render()});
$$('.oc').forEach(c=>c.onclick=()=>{const o=ORD.find(x=>x.no===c.dataset.no);const i=ST.indexOf(o.st);if(i===ST.length-1||(o.st==='ready'&&o.type!=='delivery')){ORD=ORD.filter(x=>x!==o)}else o.st=ST[i+1];render()});
const sim=$('#sim');if(sim)sim.onchange=()=>{LIVE=sim.checked;sched()};
$$('.tb').forEach(b=>b.onclick=()=>{const t=TAB.find(x=>x.no===b.dataset.t);t.st={available:'occupied',occupied:'reserved',reserved:'available'}[t.st];render()});
$$('.sw[data-i]').forEach(b=>b.onclick=()=>{MENU.forEach(([c,it])=>it.forEach(i=>{if(i[0]===b.dataset.i)i[2]=i[2]?0:1}));render()});
$$('.sw[data-c]').forEach(b=>b.onclick=()=>{COUP[+b.dataset.c][2]^=1;render()});
const adj=$('#adj');if(adj)adj.onclick=()=>{const p=+$('#pct').value||0;MENU.forEach(([c,it])=>it.forEach(i=>i[1]=Math.round(i[1]*(1+p/100))));render()}}
function sched(){clearInterval(timer);if(LIVE)timer=setInterval(()=>{if(mode==='rest'&&view==='live'){ORD.push(newOrder(rnd(Date.now())));render()}},5000)}
$('#ten').onchange=e=>{if(e.target.value==='master'){mode='master';view='master'}else{tenant=e.target.value;mode='rest';view='live';resetTenantData()}render()};
$('#menu').onclick=()=>$('#side').classList.toggle('on');
$$('#rng button').forEach(b=>b.onclick=()=>{days=+b.dataset.d;$$('#rng button').forEach(x=>x.classList.toggle('on',x===b));render()});
const r=document.documentElement;try{const s=localStorage.getItem('th');if(s)r.dataset.theme=s}catch(e){}
$('#t').onclick=()=>{const n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}render()};
render();
